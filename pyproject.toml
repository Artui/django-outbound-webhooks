[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-outbound-webhooks"
dynamic = ["version"]
description = "Outbound webhooks for Django: a customer-facing endpoint registry, Standard Webhooks signing and per-endpoint delivery, built as a durable receiver on django-domain-events."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "webhooks", "outbound-webhooks", "standard-webhooks", "domain-events", "delivery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # The substrate. Durability, at-least-once delivery inside the firing
    # transaction, per-receiver retry, dead-lettering and replay all live there
    # and are deliberately not rebuilt here. The floor buys the receiver's
    # on_failure hook, without which the delivery log records successes and
    # silently loses every failure: a receiver runs inside the transaction
    # carrying its acknowledgement, so everything it writes is discarded the
    # moment it raises.
    "django-domain-events>=0.8.0",
    # The transport. Chosen over its predecessor because the request-forgery
    # policy is a transport concern: pinning a validated address while TLS still
    # validates the customer's hostname needs the connection layer's SNI
    # override, and httpx has not released since 2024-12.
    "httpx2>=2.12.0",
    # Retry *within* one delivery attempt, which is a different tier from the
    # substrate's retry across deliveries. It is here for the failure
    # classification more than the sleeping: a webhook verdict is a status code,
    # a return value rather than an exception, and the substrate can only retry
    # what raises.
    "tenacity>=9.1.4",
    # Signing, to the Standard Webhooks specification. Six lines of HMAC that
    # every receiver already has an off-the-shelf verifier for; the dependency
    # buys the format and its rotation semantics, not the arithmetic.
    "standardwebhooks>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/Artui/django-outbound-webhooks"
Repository = "https://github.com/Artui/django-outbound-webhooks"
Issues = "https://github.com/Artui/django-outbound-webhooks/issues"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.32",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    # Backs the ``TID`` rule selection below; ruff reads its settings from the
    # flake8-tidy-imports namespace and the plugin is what defines them.
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.1.0",
    # No HTTP mocking library. ``respx`` is the obvious reach and it declares
    # ``httpx>=0.25.0``, so adding it installs a *second* HTTP client and every
    # assertion about the wire would be made against the one this package does
    # not use. httpx2 ships ``MockTransport``, which stubs the same transport
    # the code under test actually calls.
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["django_outbound_webhooks"]

[tool.hatch.version]
path = "django_outbound_webhooks/version.py"
# Hatchling's default regex expects a bare ``__version__ = "..."``. This file
# annotates the assignment, so the pattern has to allow the annotation or the
# build cannot find the version at all.
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=django_outbound_webhooks --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["django_outbound_webhooks"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = ["E203", "E501", "E231", "F811", "E722", "E741", "UP040", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_outbound_webhooks"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
root = ["./django_outbound_webhooks"]

[tool.bumpversion]
current_version = "0.0.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_outbound_webhooks/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-outbound-webhooks/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-outbound-webhooks/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-outbound-webhooks/compare/v{current_version}...v{new_version}"""
